# Platform agent (Part IV, Chapters 11-12). Fictional Acme workload; the image does not exist.
# Every tool call goes through the evaluating gateway (tools/asc_gate.py models its decisions);
# see networkpolicy.yaml for the network side of "no gateway, no tool call".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-agent
  namespace: ai
  labels:
    app: platform-agent
    acme.example/threat-model: agent-mcp-tool-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-agent
  template:
    metadata:
      labels:
        app: platform-agent
    spec:
      serviceAccountName: platform-agent
      containers:
        - name: agent
          image: acme.example/platform-agent:0.1.0
          env:
            - name: MCP_ENDPOINT
              value: http://mcp-gateway.ai.svc
            - name: DEFAULT_VERDICT
              value: REQUIRE_APPROVAL
            - name: AGENT_POLICY_REF
              value: agents/contracts/demo-agent.policy.yaml
