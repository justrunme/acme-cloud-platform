apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: orders
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: acme.example/orders:2.1.0
          env:
            - name: DATABASE_URL
              value: postgres://orders-ro@postgres.payments.svc:5432/payments?sslmode=require
            - name: PAYMENTS_URL
              value: http://payments.payments.svc
          ports:
            - containerPort: 8080
