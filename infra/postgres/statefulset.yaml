apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: payments
  labels:
    app: postgres
    acme.example/data-plane: "true"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: acme.example/postgres:15.8
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: payments
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd-v1
        resources:
          requests:
            storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: payments
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
