apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-edge
  namespace: payments
  annotations:
    acme.example/note: Shared edge — blast radius spans payments and orders paths
spec:
  ingressClassName: acme-nginx
  rules:
    - host: pay.acme.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments
                port:
                  number: 80
