apiVersion: v1
kind: Namespace
metadata:
  name: acme-evidence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-store
  namespace: acme-evidence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evidence-store
  template:
    metadata:
      labels:
        app: evidence-store
    spec:
      containers:
        - name: store
          image: acme-gate:e2e
          imagePullPolicy: Never
          args: ["tools.evidence_store"]
          env:
            - name: ACME_RECORDS_DIR
              value: /var/lib/acme/records
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: records
              mountPath: /var/lib/acme
      volumes:
        - name: records
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-store
  namespace: acme-evidence
spec:
  selector:
    app: evidence-store
  ports:
    - port: 8080
      targetPort: 8080
